$schema: "http://json-schema.org/draft/2020-12/schema#"

description: snakemake configuration file

definitions:
  envmodules_list:
    description: >-
      hpc environment module list
    type: array
    items:
      type: string
    uniqueItems: true

  analyses:
    description: >-
      List of analyses that can be toggled
    type: object
    default: {}
    properties:
      bowtie2:
        description: >-
          bowtie2 indexing/alignment
        type: boolean
        default: true
      mapdamage:
        description: >-
          mapdamage analysis
        type: boolean
        default: true
      authentication:
        description: >-
          authentication analysis
        type: boolean
        default: true
      malt:
        description: >-
          malt analysis
        type: boolean
        default: true
      krona:
        description: >-
          krona analysis
        type: boolean
        default: true

type: object

# possible entries of the config file and which type they should be
properties:

  krakenuniq_db:
    type: string
    description: >-
      KrakenUniq database
  bowtie2_db:
    type: string
    description: >-
      Bowtie2 database (can be PathoGenome or full NT)
  bowtie2_seqid2taxid_db:
    type: string
    description: >-
      A mapping file for finding correspondence between reference sequence ids from fasta and taxIDs from taxonomy
  pathogenomesFound:
    type: string
    description: >-
      List of pathogens to keep when filtering krakenuniq output
  malt_seqid2taxid_db:
    type: string
    description: >-
      Sequence id to taxonomy id mapping
  malt_nt_fasta:
    type: string
    description: >-
      Fasta library
  malt_accession2taxid:
    type: string
    description: >-
      Accession to taxonomy id mapping
  malt_parse_taxon_names:
    type: boolean
    default: true
    description: >-
      malt-build's -tn/--parseTaxonNames. When true (malt-build's own default)
      MALT labels each reference by parsing organism names out of its FASTA
      description as well as looking the accession up in -a2t, and takes the LCA
      of every name it matches -- so a description that names a second organism
      (a homolog it is "similar to", a cloning host, a lab in a clone name)
      pulls the label to a coarser or unrelated node, and the same reference can
      drive a species-level false positive for MALT and a genus-level one for
      ngsLCA. Set false to label from the accession alone, which is what
      ngsLCA's -acc2tax does, making the two backends comparable.
  ncbi_db:
    type: string
    description: >-
      taxonomy from NCBI
  profilers:
    type: array
    items:
      type: string
    description: >-
      Alignment + taxonomy backend(s) to run. 'malt' uses MALT for both alignment 
      and LCA taxonomy (rma6). Any other label is an aligner + ngsLCA profiler 
      and must equal aligner.name (e.g. 'strobealign'). 
  taxonomic_profiler:
    type: string
    enum:
      - malt
      - aligner_ngslca
    default: malt
    description: >-
      DEPRECATED (use 'profilers'). Single alignment + taxonomy backend. 'malt'
      uses MALT for both alignment and LCA taxonomy (rma6). 'aligner_ngslca'
      replaces MALT with a pluggable read aligner (see the 'aligner' block) plus
      ngsLCA taxonomy. Only consulted when 'profilers' is not set.
  aligner:
    type: object
    default: {}
    description: >-
      Read aligner configuration, used when taxonomic_profiler is 'aligner_ngslca'.
    properties:
      name:
        type: string
        default: strobealign
        description: >-
          Aligner to use. Supported: strobealign. New aligners are added as
          guarded rule blocks in workflow/rules/align.smk.
      repo:
        type: string
        default: "https://github.com/ksahlin/strobealign"
        description: >-
          Git repository whose GitHub archive is downloaded and compiled from
          source (the aDNA strobealign is a Rust build not available on conda).
      ref:
        type: string
        default: "cc24cbd434f4ea7dd3c7fd344e3aaaf774cf4c13"
        description: >-
          Commit hash or branch to build (github.com/<repo>/archive/<ref>.zip).
      args:
        type: string
        default: "--ancient-dna --mcs=always -S 0.95 -r 30 -k 12 -N 20"
        description: >-
          Command-line arguments passed to the aligner.
      min_aligned_bp:
        type: integer
        default: 20
        description: >-
          Discard alignments covering fewer than this many query bases. Local
          aligners soft-clip, and ngsLCA scores identity over the aligned block
          only, so short seed matches otherwise clear -simscorelow as full
          species hits. 0 disables.
      min_aligned_frac:
        type: number
        default: 0.8
        description: >-
          Discard alignments covering less than this fraction of the read
          (aligned query bases / full read length). Together with min_aligned_bp
          this is what MALT gets from "-at SemiGlobal -mpi 85". 0 disables.
  ngslca_args:
    type: string
    default: "-simscorelow 0.85 -simscorehigh 1.0"
    description: >-
      Filtering arguments passed to ngsLCA. Similarity-score mode is used by
      default (0.85 ~ MALT's -mpi 85). Edit-distance mode (e.g.
      "-editdistmin 0 -editdistmax 5") is also supported.
  krona_db:
    type: string
    description: >-
      Taxonomy ID lookup database for Krona
  n_unique_kmers:
    type: integer
    description: >-
      Breadth of coverage filter for KrakenUniq output: the number of unique kmers associated with an taxon
  n_tax_reads:
    type: integer
    description: >-
      Depth of coverage filter for KrakenUniq output: the number of reads associated with the taxon on species level
  krakenuniq_preload_mode:
    type: string
    enum:
      - preload-size
      - preload_size
      - preload
    default: preload-size
    description: >-
      KrakenUniq database preloading mode. Use preload-size or preload_size to
      load the database in chunks, or preload to load the full database into memory.
  krakenuniq_preload_size:
    type: string
    default: "32G"
    description: >-
      KrakenUniq preload chunk size used with --preload-size. This controls the
      database chunk size, not the total memory used by the job.
  malt_max_heap:
    type: string
    default: ""
    description: >-
      JVM maximum heap size for malt-build and malt-run, e.g. "64G", passed as
      -J-Xmx<value>; empty (the default) keeps the MALT installation's own
      .vmoptions setting.

  envmodules:
    type: object
    description: >-
      envmodules listings for relevant rules. The keyword groups rules
      that share conda environment file. The provided examples give an
      idea of what modules to load. Note that the names may differ
      depending on what naming conventions your HPC employs.
    default: {}
    properties:
      fastqc:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - FastQC
      cutadapt:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - cutadapt
      multiqc:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - MultiQC
      bowtie2:
        default: []
        description: >-
          Note that rule Bowtie2_Alignment also requires
          samtools.
        $ref: "#/definitions/envmodules_list"
        example:
          - Bowtie2
          - SAMtools
      mapdamage:
        default: []
        $ref: "#/definitions/envmodules_list"
        description: >-
          Mapdamage rule depends on not only mapdamage but also R,
          parallel, and samtools
        example:
          - MapDamage
          - R
          - parallel
          - SAMtools
      krakenuniq:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - KrakenUniq
      r:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - R
      krona:
        default: []
        $ref: "#/definitions/envmodules_list"
        description: >-
          krona rules depend on Krona and R.
        example:
          - R
          - Krona
      Build_Malt_DB:
        default: []
        $ref: "#/definitions/envmodules_list"
      malt:
        default: []
        $ref: "#/definitions/envmodules_list"
        description: >-
          malt-dependent rules have multiple dependencies
        example:
          - malt
          - hops
          - pmdtools
          - seqtk
          - megan
      samtools:
        default: []
        $ref: "#/definitions/envmodules_list"
        example:
          - SAMtools

  options:
    type: object
    description: >-
      program options string
    default: {}
    properties:
      MapDamage:
        default: --no-stats
        type: string


  adapters:
    type: object
    default: {}
    properties:
      illumina:
        type: boolean
        description: >-
          Add Illumina adapter AGATCGGAAGAG to adapter list
        default: true
      nextera:
        type: boolean
        description: >-
          Add Nextera adapter CTGTCTCTTATA to adapter list
        default:
          false
      custom:
        type: array
        items:
          type: string
        description: >-
          List of custom adapters to use for trimming.
  samplesheet:
    description: >-
      Sample sheet. Tab- or comma-separated values. See
      samples.schema.yaml for a description of file format.
    type: string
    pattern: .+\.(tsv|csv)$
  samples:
    type: object
    default: {}
    properties:
      include:
        description: >-
          Samples to include in analysis. If empty use all samples in
          sampleinfo file
        type: array
        items:
          type: string
        uniqueItems: true
      exclude:
        description: >-
          Samples to exclude from analysis.
        type: array
        items:
          type: string
        uniqueItems: true
  analyses:
    default: {}
    $ref: "#/definitions/analyses"


# entries that have to be in the config file for successful validation
required:
  - samplesheet
  - krakenuniq_db
  - bowtie2_db
  - pathogenomesFound
  - bowtie2_seqid2taxid_db
  - malt_seqid2taxid_db
  - malt_nt_fasta
  - malt_accession2taxid
  - ncbi_db
  - n_unique_kmers
  - n_tax_reads
