samplesheet: "config/samples.tsv"
samples:
  include:
    - foo
  exclude:
    - bar

# Databases
krakenuniq_db: resources/krakendb
pathogenomesFound: resources/pathogenomesFound.tab
bowtie2_seqid2taxid_db: resources/seqid2taxid.pathogen.map
bowtie2_db: resources/bowtie2db
malt_seqid2taxid_db: resources/malt_seq2tax
malt_nt_fasta: resources/maltntfasta
malt_accession2taxid: resources/malt_acc2tax

# Toggle malt-build's -tn/--parseTaxonNames option
malt_parse_taxon_names: true
ncbi_db: resources/ncbi

# JVM max heap for malt-build and malt-run
# malt_max_heap: "32G"

# Alignment + taxonomy backend(s). Each profiler writes its own authentication
# outputs under results/AUTHENTICATION/<profiler>/ and its own score heatmap.
profilers:
  - malt

# Settings of each aligner used by an aligner + ngsLCA profiler, keyed by the
# profiler name, e.g. `profilers: [malt, strobealign]`.
aligners:
  # strobealign is compiled from the GitHub archive of repo@ref.
  strobealign:
    repo: "https://github.com/ksahlin/strobealign"
    ref: "4be2dcc208fa54a8c8caed2146adf116f52c382c"
    args: "--adna -k 17 -s 13 --ry-len 8 -M 1000 --ssw -L 30 --secondary-seq --st 0.9 -N -1"
    # Mean read length after trimming; selects the parameter profile the
    # strobealign index is built for.
    read_length: 45
  # -k reports up to that many hits per read for ngsLCA; max_score_drop keeps
  # hits within that many AS points of the read's best (about one mismatch).
  bowtie2:
    args: "--very-sensitive -k 1000"
    max_score_drop: 6
  # Reads with more than max_hits hits are dropped (bwa samse -n).
  bwa_aln:
    args: "-n 0.01 -o 2 -l 1024"
    max_hits: 1000

# Drop alignments of any aligner covering fewer than min_aligned_bp read bases
# or less than min_aligned_frac of the read. 0 disables the filter.
alignment_filter:
  min_aligned_bp: 20
  min_aligned_frac: 0.8

# ngsLCA read-filtering arguments for aligner + ngsLCA profilers.
# -simscorelow 0.85 roughly matches MALT's -mpi 85.
ngslca_args: "-simscorelow 0.85 -simscorehigh 1.0"

# Breadth and depth of coverage filters    
n_unique_kmers: 1000
n_tax_reads: 200

# KrakenUniq database preloading
# Default: --preload-size 32G
# To use the original full preload behaviour, set krakenuniq_preload_mode: "preload".
krakenuniq_preload_size: "32G"
