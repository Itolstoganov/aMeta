samplesheet: "config/samples.tsv"
samples:
  include:
    - foo
  exclude:
    - bar

# Databases
krakenuniq_db: resources/krakendb
pathogenomesFound: resources/pathogenomesFound.tab
bowtie2_seqid2taxid_db: resources/seqid2taxid.pathogen.map
bowtie2_db: resources/bowtie2db
malt_seqid2taxid_db: resources/malt_seq2tax
malt_nt_fasta: resources/maltntfasta
malt_accession2taxid: resources/malt_acc2tax

# malt-build's -tn/--parseTaxonNames. true (malt-build's default) also labels a
# reference from organism names parsed out of its FASTA description, LCA'd
# together, which pulls labels to coarser or unrelated nodes; false labels from
# the accession alone, matching ngsLCA's -acc2tax.
malt_parse_taxon_names: true
ncbi_db: resources/ncbi

# JVM max heap for malt-build and malt-run; unset keeps MALT's own .vmoptions setting.
# malt_max_heap: "64G"

# Alignment + taxonomy backend(s). One or more may be listed; each profiler
# produces its own independent authentication tree under
# results/AUTHENTICATION/<profiler>/, abundance matrix, and score heatmap.
#   malt         MALT does both alignment and LCA taxonomy.
#   <aligner>    a read aligner (see `aligner`) + ngsLCA taxonomy.
profilers:
  - malt
  - strobealign

# Aligner used by any non-malt (aligner + ngsLCA) profiler. The aDNA strobealign
# (--ancient-dna) is a Rust build compiled from source at the given commit/branch.
aligner:
  name: strobealign
  repo: "https://github.com/ksahlin/strobealign"
  ref: "cc24cbd434f4ea7dd3c7fd344e3aaaf774cf4c13"
  args: "--adna -k 17 -s 13 --ry-len 8 -M 500 --ssw -L 32 --secondary-seq -N 20"
  # Discard alignments covering < min_aligned_bp query bases or < min_aligned_frac
  # of the read. strobealign aligns locally and soft-clips; ngsLCA scores identity
  # over the aligned block only, so short seed matches otherwise clear
  # -simscorelow as full species hits. Set both to 0 to disable.
  min_aligned_bp: 20
  min_aligned_frac: 0.8

# ngsLCA read-filtering args (aligner_ngslca path). Similarity-score mode;
# 0.85 ~ MALT's -mpi 85. Edit-distance mode also works, e.g.
# "-editdistmin 0 -editdistmax 5".
ngslca_args: "-simscorelow 0.85 -simscorehigh 1.0"

# Breadth and depth of coverage filters    
n_unique_kmers: 1000
n_tax_reads: 200

# KrakenUniq database preloading
# Default: --preload-size 32G
# To use the original full preload behaviour, set krakenuniq_preload_mode: "preload".
krakenuniq_preload_size: "32G"
