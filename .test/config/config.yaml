samplesheet: resources/samples.tsv
samples:
  include:
    - foo
    - bar
  exclude:
    - foobar

analyses:
  mapdamage: true
  authentication: true
  malt: true

adapters:
  illumina: true
  nextera: false
  custom: []
  

# Databases
krakenuniq_db: resources/KrakenUniq_DB
bowtie2_db: resources/ref.fa
pathogenomesFound: resources/pathogenomesFound.tab
bowtie2_seqid2taxid_db: resources/seqid2taxid.pathogen.map
malt_seqid2taxid_db: resources/KrakenUniq_DB/seqid2taxid.map
malt_nt_fasta: resources/ref.fa
malt_accession2taxid: resources/accession2taxid.map
ncbi_db: resources/ncbi

# Alignment + taxonomy backend (malt = classic aMeta; aligner_ngslca = aligner + ngsLCA).
taxonomic_profiler: malt
aligner:
  name: strobealign
  repo: "https://github.com/ksahlin/strobealign"
  ref: "cc24cbd434f4ea7dd3c7fd344e3aaaf774cf4c13"
  args: "--ancient-dna --mcs=always -S 0.95 -r 30 -k 12"
  max_secondary: 20

# Breadth and depth of coverage filters
n_unique_kmers: 1000
n_tax_reads: 200

# KrakenUniq database preloading
# Test default: --preload-size 1G
# To use the original full preload behaviour, set krakenuniq_preload_mode: "preload".
krakenuniq_preload_size: "1G"
